name: Build and Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: hayati-web
          path: dist
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build Android APK and Store Bundle
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease lintRelease --no-daemon
      - name: Prepare Signing Tool
        run: cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android/app/build/outputs/apk/release/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: hayati-android-release
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/apksigner.jar
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
